<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Simpan</title>
<desc id="desc">A SQL database written from scratch in Java: B+tree indexes, MVCC transactions, a write-ahead log with crash recovery, a cost-based planner, and the PostgreSQL wire protocol, so psql and JDBC can connect to it.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2.5">DATABASE · JAVA</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🗄️ Simpan</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#38bdf8">▸</tspan> psql and JDBC connect over PostgreSQL's protocol</text>
    <text x="28" y="134"><tspan fill="#38bdf8">▸</tspan> MVCC + WAL: survives kill -9; DP join ordering</text>
    <text x="28" y="158"><tspan fill="#38bdf8">▸</tspan> 3,000 random queries checked against H2</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="74" height="24" rx="12" fill="#fb923c" fill-opacity=".15" stroke="#fb923c" stroke-opacity=".55"/><text x="65" y="242" fill="#fdba74" text-anchor="middle">Java 21</text>
    <rect x="108" y="226" width="67" height="24" rx="12" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".55"/><text x="141.5" y="242" fill="#7dd3fc" text-anchor="middle">B+tree</text>
    <rect x="181" y="226" width="52" height="24" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/><text x="207" y="242" fill="#c4b5fd" text-anchor="middle">MVCC</text>
    <rect x="239" y="226" width="159" height="24" rx="12" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa" stroke-opacity=".55"/><text x="318.5" y="242" fill="#93c5fd" text-anchor="middle">PostgreSQL protocol</text>
  </g>
  <text x="440" y="270" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <g fill="none" stroke="#38bdf8" stroke-width="2"><rect x="30" y="0" width="32" height="14" rx="3"/><rect x="0" y="38" width="26" height="14" rx="3" opacity=".55"/><rect x="33" y="38" width="26" height="14" rx="3"/><rect x="66" y="38" width="26" height="14" rx="3" opacity=".55"/><path d="M38 14L13 38M46 14L46 38M54 14L79 38" opacity=".55"/></g><path d="M46 14L46 38" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24"><animate attributeName="stroke-dashoffset" values="24;0;0" dur="2s" repeatCount="indefinite"/></path><rect x="36" y="41" width="20" height="8" rx="2" fill="#38bdf8" opacity=".8"/>
</g>
</svg>
