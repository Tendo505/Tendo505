<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Quorum</title>
<desc id="desc">The Raft consensus algorithm in Java 21, tested by a deterministic simulator that crashes servers, partitions the network and loses messages while checking every safety invariant and linearizability. It catches five planted Raft bugs, and a replay viewer shows the runs.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c0f05"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb923c"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#fb923c" font-size="11" font-weight="700" letter-spacing="2.5">DISTRIBUTED SYSTEMS · JAVA</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🗳️ Quorum</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#fb923c">▸</tspan> Raft: elections, replication, crash recovery</text>
    <text x="28" y="134"><tspan fill="#fb923c">▸</tspan> Deterministic simulator: 10,000 seeds in 10 s</text>
    <text x="28" y="158"><tspan fill="#fb923c">▸</tspan> Checks linearizability; catches 5 planted bugs</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="74" height="24" rx="12" fill="#fb923c" fill-opacity=".15" stroke="#fb923c" stroke-opacity=".55"/><text x="65" y="242" fill="#fdba74" text-anchor="middle">Java 21</text>
    <rect x="108" y="226" width="74" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="145" y="242" fill="#86efac" text-anchor="middle">JUnit 5</text>
    <rect x="188" y="226" width="52" height="24" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/><text x="214" y="242" fill="#c4b5fd" text-anchor="middle">Raft</text>
    <rect x="246" y="226" width="152" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".55"/><text x="322" y="242" fill="#5eead4" text-anchor="middle">Simulation testing</text>
  </g>
  <text x="440" y="270" fill="#fb923c" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <g stroke="#fb923c" stroke-opacity=".35" stroke-width="1.5"><line x1="45" y1="0" x2="67.82535639108369" y2="16.58359213500126"/><line x1="45" y1="0" x2="59.10684605501935" y2="43.41640786499874"/><line x1="45" y1="0" x2="30.893153944980646" y2="43.41640786499874"/><line x1="45" y1="0" x2="22.174643608916313" y2="16.583592135001265"/></g><circle cx="45" cy="0" r="8" fill="#fb923c" opacity="1"/><circle cx="67.82535639108369" cy="16.58359213500126" r="6" fill="#fb923c" opacity=".55"/><circle cx="59.10684605501935" cy="43.41640786499874" r="6" fill="#fb923c" opacity=".55"/><circle cx="30.893153944980646" cy="43.41640786499874" r="6" fill="#fb923c" opacity=".55"/><circle cx="22.174643608916313" cy="16.583592135001265" r="6" fill="#fb923c" opacity=".55"/><circle r="2.5" fill="#fb923c"><animate attributeName="cx" values="45;67.82535639108369" dur="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="0;16.58359213500126" dur="1.2s" repeatCount="indefinite"/></circle><circle r="2.5" fill="#fb923c"><animate attributeName="cx" values="45;59.10684605501935" dur="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="0;43.41640786499874" dur="1.2s" repeatCount="indefinite"/></circle><circle r="2.5" fill="#fb923c"><animate attributeName="cx" values="45;30.893153944980646" dur="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="0;43.41640786499874" dur="1.2s" repeatCount="indefinite"/></circle><circle r="2.5" fill="#fb923c"><animate attributeName="cx" values="45;22.174643608916313" dur="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="0;16.583592135001265" dur="1.2s" repeatCount="indefinite"/></circle>
</g>
</svg>
