<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Amirul Harith</title>
<desc id="desc">Android and backend developer. Computer Science student, available for a software engineering internship from 30 November 2026 to 19 February 2027.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05070f"/><stop offset=".55" stop-color="#0a1330"/><stop offset="1" stop-color="#0b2a3f"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1">
    <stop stop-color="#60a5fa"/><stop offset=".33" stop-color="#a78bfa"/><stop offset=".66" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <radialGradient id="b1"><stop stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="b2"><stop stop-color="#0ea5e9" stop-opacity=".45"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <radialGradient id="b3"><stop stop-color="#14b8a6" stop-opacity=".4"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="card"><rect width="960" height="400" rx="24"/></clipPath>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .m{font-family:Consolas,'Cascadia Code',Menlo,monospace}
  .drift1{animation:d1 14s ease-in-out infinite}
  .drift2{animation:d2 18s ease-in-out infinite}
  .drift3{animation:d3 16s ease-in-out infinite}
  @keyframes d1{50%{transform:translate(120px,40px)}}
  @keyframes d2{50%{transform:translate(-140px,-30px)}}
  @keyframes d3{50%{transform:translate(60px,-50px)}}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
  .r1{animation-delay:.1s}.r2{animation-delay:.35s}.r3{animation-delay:.6s}.r4{animation-delay:.85s}.r5{animation-delay:1.1s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .role{opacity:0;animation:role 12s infinite}
  .ro2{animation-delay:3s}.ro3{animation-delay:6s}.ro4{animation-delay:9s}
  @keyframes role{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-8px)}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{to{transform:scale(2.6);opacity:0}}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(440px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.ro1{opacity:1}}
</style>

<g clip-path="url(#card)">
  <rect width="960" height="400" fill="url(#bg)"/>
  <rect width="960" height="400" fill="url(#grid)"/>
  <circle class="drift1" cx="180" cy="80" r="260" fill="url(#b1)"/>
  <circle class="drift2" cx="820" cy="300" r="280" fill="url(#b2)"/>
  <circle class="drift3" cx="560" cy="40" r="200" fill="url(#b3)"/>
  <rect class="scan" x="0" y="0" width="960" height="2" fill="#7dd3fc" opacity=".08"/>
</g>
<rect x="1" y="1" width="958" height="398" rx="23" fill="none" stroke="url(#name)" stroke-opacity=".5" stroke-width="2"/>

<g class="t">
  <g class="rise r1">
    <rect x="56" y="48" width="352" height="34" rx="17" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".55"/>
    <circle cx="78" cy="65" r="5" fill="#22c55e"/><circle class="ping" cx="78" cy="65" r="5" fill="#22c55e"/>
    <text x="94" y="70" fill="#86efac" font-size="13" font-weight="600" letter-spacing="1.2">OPEN FOR INTERNSHIP · NOV 2026 – FEB 2027</text>
  </g>
  <text class="rise r2" x="58" y="126" fill="#94a3b8" font-size="15" letter-spacing="6">HI, I'M</text>
  <g class="rise r3" filter="url(#glow)">
    <text x="52" y="198" fill="url(#name)" font-size="70" font-weight="800" letter-spacing="-1">AMIRUL HARITH</text>
  </g>
  <g class="rise r4 m" font-size="22">
    <text x="58" y="246" fill="#2dd4bf">~/</text>
    <text x="88" y="246" fill="#f8fafc" class="role ro1">Android developer</text>
    <text x="88" y="246" fill="#f8fafc" class="role ro2">Backend &amp; REST API builder</text>
    <text x="88" y="246" fill="#f8fafc" class="role ro3">Database designer</text>
    <text x="88" y="246" fill="#f8fafc" class="role ro4">Dean's List CS student</text>
  </g>
  <g class="rise r5">
    <text x="58" y="296" fill="#cbd5e1" font-size="17">Computer Science · International Islamic College · Selangor, Malaysia</text>
    <g font-size="13" font-weight="700" letter-spacing="1">
      <rect x="58" y="320" width="98" height="30" rx="8" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="107" y="340" fill="#c4b5fd" text-anchor="middle">KOTLIN</text>
      <rect x="166" y="320" width="98" height="30" rx="8" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".5"/><text x="215" y="340" fill="#fca5a5" text-anchor="middle">LARAVEL</text>
      <rect x="274" y="320" width="118" height="30" rx="8" fill="#60a5fa" fill-opacity=".14" stroke="#60a5fa" stroke-opacity=".5"/><text x="333" y="340" fill="#93c5fd" text-anchor="middle">POSTGRESQL</text>
      <rect x="402" y="320" width="98" height="30" rx="8" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".5"/><text x="451" y="340" fill="#fdba74" text-anchor="middle">JAVA</text>
    </g>
  </g>
</g>

<!-- Android app <-> REST API <-> database -->
<g transform="translate(0 10)">
<path d="M742 190 V250 M742 300 V316" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/>
<circle r="5" fill="#2dd4bf" filter="url(#soft)"><animateMotion dur="2s" repeatCount="indefinite" path="M742 190 V316"/></circle>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2s" repeatCount="indefinite" path="M742 190 V316"/></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M742 316 V190"/></circle>

<g class="float">
  <rect x="690" y="40" width="104" height="150" rx="18" fill="#060a16" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="728" y="49" width="28" height="5" rx="2.5" fill="#334155"/>
  <rect x="702" y="64" width="80" height="34" rx="8" fill="url(#accent)" opacity=".9"/>
  <circle cx="718" cy="81" r="8" fill="#060a16" opacity=".35"/>
  <rect x="732" y="75" width="40" height="5" rx="2.5" fill="#fff" opacity=".85"/><rect x="732" y="84" width="26" height="4" rx="2" fill="#fff" opacity=".55"/>
  <g fill="#14243f"><rect x="702" y="106" width="80" height="14" rx="4"/><rect x="702" y="125" width="80" height="14" rx="4"/><rect x="702" y="144" width="80" height="14" rx="4"/></g>
  <g><circle cx="711" cy="113" r="3" fill="#2dd4bf"/><circle cx="711" cy="132" r="3" fill="#fbbf24"/><circle cx="711" cy="151" r="3" fill="#a78bfa"/></g>
  <rect x="702" y="166" width="80" height="14" rx="7" fill="#132c50" stroke="#2dd4bf"/>
</g>
<g class="t">
  <rect x="706" y="250" width="72" height="50" rx="12" fill="#060a16" stroke="#2dd4bf" stroke-width="2"/>
  <text x="742" y="281" fill="#2dd4bf" font-size="15" font-weight="800" text-anchor="middle">API</text>
  <circle cx="768" cy="260" r="3" fill="#22c55e"/><circle class="ping" cx="768" cy="260" r="3" fill="#22c55e"/>
</g>
<g transform="translate(718 316)" stroke="#a78bfa" stroke-width="2" fill="#060a16">
  <path d="M0 8 v34 c0 10 48 10 48 0 v-34"/>
  <ellipse cx="24" cy="8" rx="24" ry="8"/>
  <path d="M0 25 c0 10 48 10 48 0" fill="none" opacity=".6"/>
</g>
<g class="t m" font-size="11" fill="#64748b" letter-spacing="1.5">
  <text x="812" y="120">ANDROID · KOTLIN</text><text x="796" y="280">LARAVEL · REST</text><text x="780" y="345">POSTGRESQL</text>
</g>
</g>
</svg>
