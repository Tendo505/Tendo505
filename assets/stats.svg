<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
<title id="title">At a glance</title>
<desc id="desc">Dean's List Award, Faculty of ICT, Semester 1 2025/2026. Eleven projects across Android, backend, web and systems. Available for a three-month internship from 30 November 2026 to 19 February 2027.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1022"/><stop offset="1" stop-color="#0f1f3a"/></linearGradient>
  <linearGradient id="g2" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <linearGradient id="g3" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="g4" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .tile{opacity:0;animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards}
  .a2{animation-delay:.15s}.a3{animation-delay:.3s}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{to{transform:scale(2.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){.tile{animation:none;opacity:1}.ping{animation:none}}
</style>
<g class="t">
  <g class="tile">
    <rect x="1" y="1" width="306" height="148" rx="18" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="26" y="40" fill="#94a3b8" font-size="12" letter-spacing="2.5">ACHIEVEMENT</text>
    <text x="24" y="92" fill="url(#g2)" font-size="40" font-weight="800">Dean's List</text>
    <text x="26" y="124" fill="#94a3b8" font-size="13">Faculty of ICT · Sem 1 2025/2026</text>
    <path transform="translate(262 22)" d="M10 0l3 6.5 7 .8-5.2 4.8 1.4 7L10 15.6 3.8 19l1.4-7L0 7.3l7-.8z" fill="#fbbf24"/>
  </g>
  <g class="tile a2" transform="translate(326 0)">
    <rect x="1" y="1" width="306" height="148" rx="18" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="26" y="40" fill="#94a3b8" font-size="12" letter-spacing="2.5">PROJECTS BUILT</text>
    <text x="24" y="100" fill="url(#g3)" font-size="58" font-weight="800">13</text>
    <text x="102" y="80" fill="#cbd5e1" font-size="15">Android · Backend</text>
    <text x="102" y="100" fill="#cbd5e1" font-size="15">Web · Systems</text>
    <g fill="#a78bfa"><rect x="26" y="120" width="80" height="6" rx="3"/><rect x="114" y="120" width="80" height="6" rx="3" opacity=".7"/><rect x="202" y="120" width="80" height="6" rx="3" opacity=".45"/></g>
  </g>
  <g class="tile a3" transform="translate(652 0)">
    <rect x="1" y="1" width="306" height="148" rx="18" fill="url(#bg)" stroke="#22c55e" stroke-opacity=".5" stroke-width="1.5"/>
    <circle cx="30" cy="36" r="4.5" fill="#22c55e"/><circle class="ping" cx="30" cy="36" r="4.5" fill="#22c55e"/>
    <text x="44" y="40" fill="#86efac" font-size="12" letter-spacing="2.5">AVAILABLE</text>
    <text x="24" y="88" fill="url(#g4)" font-size="34" font-weight="800">3-month</text>
    <text x="182" y="88" fill="#f8fafc" font-size="18" font-weight="600">internship</text>
    <text x="26" y="124" fill="#94a3b8" font-size="13">30 Nov 2026 – 19 Feb 2027</text>
  </g>
</g>
</svg>
