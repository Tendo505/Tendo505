    <text x="22" y="92" fill="url(#g1)" font-size="50" font-weight="800">3.30</text>
    <rect x="24" y="114" width="180" height="6" rx="3" fill="#1e293b"/>
    <rect class="bar" x="24" y="114" width="148.5" height="6" rx="3" fill="url(#g1)" style="transform-origin:24px 0"/>
  </g>
  <g class="tile a2" transform="translate(244 0)">
    <rect x="1" y="1" width="228" height="148" rx="18" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
