    <g fill="#a78bfa"><rect x="24" y="114" width="56" height="6" rx="3"/><rect x="86" y="114" width="56" height="6" rx="3" opacity=".7"/><rect x="148" y="114" width="56" height="6" rx="3" opacity=".45"/></g>
