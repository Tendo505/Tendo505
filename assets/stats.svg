<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
<title id="title">At a glance</title>
<desc id="desc">CGPA 3.30. Dean's List Award, Faculty of ICT, Semester 1 2025/2026. Three full projects across Android and web. Available for a three-month internship from 30 November 2026 to 19 February 2027.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1022"/><stop offset="1" stop-color="#0f1f3a"/></linearGradient>
  <linearGradient id="g1" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="g2" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <linearGradient id="g3" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="g4" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .tile{opacity:0;animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards}
  .a2{animation-delay:.15s}.a3{animation-delay:.3s}.a4{animation-delay:.45s}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .bar{animation:fill 1.6s .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fill{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.tile,.bar{animation:none;opacity:1}}
</style>
