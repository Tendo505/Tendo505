    <text x="24" y="132" fill="#64748b" font-size="12">Semester 1 · 2025/2026</text>
    <path transform="translate(186 22)" d="M10 0l3 6.5 7 .8-5.2 4.8 1.4 7L10 15.6 3.8 19l1.4-7L0 7.3l7-.8z" fill="#fbbf24"/>
  </g>
  <g class="tile a3" transform="translate(488 0)">
    <rect x="1" y="1" width="228" height="148" rx="18" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94a3b8" font-size="12" letter-spacing="2.5">PROJECTS BUILT</text>
