<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Quill</title>
<desc id="desc">A small scripting language with closures, pipes and compiler-quality error messages: lexer, Pratt parser, static resolver and tree-walking interpreter in strict TypeScript, with a browser playground.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#130b24"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="2.5">LANGUAGE · INTERPRETER</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🪶 Quill</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#a78bfa">▸</tspan> Lexer → Pratt parser → resolver → interpreter</text>
    <text x="28" y="134"><tspan fill="#a78bfa">▸</tspan> Closures, pipes |&gt;, try/catch, 47 builtins</text>
    <text x="28" y="158"><tspan fill="#a78bfa">▸</tspan> Browser playground in a Web Worker · 112 tests</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="95" height="24" rx="12" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa" stroke-opacity=".55"/><text x="75.5" y="242" fill="#93c5fd" text-anchor="middle">TypeScript</text>
    <rect x="129" y="226" width="52" height="24" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/><text x="155" y="242" fill="#c4b5fd" text-anchor="middle">Vite</text>
    <rect x="187" y="226" width="109" height="24" rx="12" fill="#cbd5e1" fill-opacity=".15" stroke="#cbd5e1" stroke-opacity=".55"/><text x="241.5" y="242" fill="#e2e8f0" text-anchor="middle">GitHub Pages</text>
  </g>
  <text x="440" y="270" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <text x="0" y="22" fill="#a78bfa" font-family="Consolas,monospace" font-size="15" font-weight="700">&gt; fn</text><text x="0" y="46" fill="#a78bfa" opacity=".6" font-family="Consolas,monospace" font-size="15">|&gt; map</text><rect x="72" y="34" width="3" height="16" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</svg>
