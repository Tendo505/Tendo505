<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Phone Market Tracker</title>
<desc id="desc">Android sales and inventory app built with Java, Android XML and SQLite. SQLite-backed login, phone inventory and cart; transactional checkout, stock validation, and revenue and profit or loss calculations.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1a0f0a"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .b{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
  .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
  @keyframes grow{from{transform:scaleY(0)}}
  @media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#fb923c" font-size="11" font-weight="700" letter-spacing="2.5">ANDROID · SALES &amp; INVENTORY</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">📱 Phone Market Tracker</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#fb923c">▸</tspan> SQLite-backed login, inventory and cart</text>
    <text x="28" y="132"><tspan fill="#fb923c">▸</tspan> Transactional checkout with stock</text>
    <text x="42" y="150">validation and updates</text>
    <text x="28" y="172"><tspan fill="#fb923c">▸</tspan> Revenue and profit/loss calculations</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="52" height="24" rx="12" fill="#fb923c" fill-opacity=".15" stroke="#fb923c" stroke-opacity=".55"/><text x="54" y="242" fill="#fdba74" text-anchor="middle">Java</text>
    <rect x="86" y="226" width="92" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="132" y="242" fill="#86efac" text-anchor="middle">Android XML</text>
    <rect x="184" y="226" width="62" height="24" rx="12" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa" stroke-opacity=".55"/><text x="215" y="242" fill="#93c5fd" text-anchor="middle">SQLite</text>
  </g>
  <text x="440" y="270" fill="#fb923c" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 190)" fill="#fb923c">
  <rect class="b" x="0" y="22" width="14" height="28" rx="3" opacity=".45"/><rect class="b b2" x="20" y="8" width="14" height="42" rx="3" opacity=".65"/><rect class="b b3" x="40" y="-6" width="14" height="56" rx="3" opacity=".95"/><rect class="b b4" x="60" y="14" width="14" height="36" rx="3" opacity=".6"/>
</g>
</svg>
