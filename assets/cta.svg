<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
<title id="title">Let's build something</title>
<desc id="desc">Looking for a software engineering, backend or mobile development intern from 30 November 2026 to 19 February 2027? Email amirulharith505@gmail.com.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset=".5" stop-color="#0c2a4d"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset=".33" stop-color="#a78bfa"/><stop offset=".66" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="4s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="btn" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".08"/></pattern>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .nudge{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){.nudge{animation:none}}
</style>
<rect x="1" y="1" width="958" height="178" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="958" height="178" rx="22" fill="url(#dots)"/>
<rect x="1" y="1" width="958" height="178" rx="22" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
<g class="t">
  <text x="48" y="66" fill="#f8fafc" font-size="32" font-weight="800">Let's build something together.</text>
  <text x="48" y="100" fill="#cbd5e1" font-size="16">Hiring a software engineering, backend or mobile intern for Nov 2026 – Feb 2027?</text>
  <text x="48" y="132" fill="#94a3b8" font-size="14">I'm ready to learn fast, ship features and handle data carefully.</text>
  <rect x="664" y="62" width="250" height="56" rx="28" fill="url(#btn)"/>
  <text x="764" y="96" fill="#05070f" font-size="17" font-weight="800" text-anchor="middle">Email me</text>
  <g class="nudge"><path d="M826 90 h26 m-9 -9 l9 9 -9 9" stroke="#05070f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
