<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Student Club Management System</title>
<desc id="desc">Group project built with PHP, MySQL, HTML, CSS and XAMPP. Member management with create, read, update and delete workflows; web forms connected to MySQL with required-field validation and unique student IDs.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#120d2a"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#818cf8"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#818cf8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .p{opacity:0;animation:in .5s forwards}.p2{animation-delay:.25s}.p3{animation-delay:.5s}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.p{animation:none;opacity:1}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="2.5">GROUP PROJECT · WEB</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🎓 Student Club System</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#818cf8">▸</tspan> Member management with full CRUD</text>
    <text x="42" y="128">workflows in PHP and MySQL</text>
    <text x="28" y="150"><tspan fill="#818cf8">▸</tspan> Web forms wired to MySQL with</text>
    <text x="42" y="168">required-field validation</text>
    <text x="28" y="190"><tspan fill="#818cf8">▸</tspan> Unique student IDs enforced</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="46" height="24" rx="12" fill="#818cf8" fill-opacity=".15" stroke="#818cf8" stroke-opacity=".55"/><text x="51" y="242" fill="#a5b4fc" text-anchor="middle">PHP</text>
    <rect x="80" y="226" width="58" height="24" rx="12" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa" stroke-opacity=".55"/><text x="109" y="242" fill="#93c5fd" text-anchor="middle">MySQL</text>
    <rect x="144" y="226" width="86" height="24" rx="12" fill="#f472b6" fill-opacity=".15" stroke="#f472b6" stroke-opacity=".55"/><text x="187" y="242" fill="#f9a8d4" text-anchor="middle">HTML / CSS</text>
    <rect x="236" y="226" width="60" height="24" rx="12" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-opacity=".55"/><text x="266" y="242" fill="#fcd34d" text-anchor="middle">XAMPP</text>
  </g>
  <text x="440" y="270" fill="#64748b" font-size="12" text-anchor="end">Coursework · private</text>
</g>
<g transform="translate(366 196)" fill="#818cf8">
  <g class="p"><circle cx="12" cy="10" r="8" opacity=".55"/><path d="M0 40 c0-14 24-14 24 0z" opacity=".55"/></g>
  <g class="p p2"><circle cx="56" cy="10" r="8" opacity=".55"/><path d="M44 40 c0-14 24-14 24 0z" opacity=".55"/></g>
  <g class="p p3"><circle cx="34" cy="6" r="9" fill="#f472b6"/><path d="M20 40 c0-18 28-18 28 0z" fill="#f472b6" opacity=".85"/></g>
</g>
</svg>
