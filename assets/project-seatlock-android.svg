<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">SeatLock Android</title>
<desc id="desc">Android app in Kotlin and Jetpack Compose for booking event tickets with live seat holds and a countdown. Client for the SeatLock API with an offline demo mode; MVVM, Retrofit, DataStore and Robolectric UI tests.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06171a"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="2.5">ANDROID · JETPACK COMPOSE</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">📲 SeatLock Android</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#2dd4bf">▸</tspan> Live hold countdown, confirm, my tickets</text>
    <text x="28" y="134"><tspan fill="#2dd4bf">▸</tspan> Safe retries with idempotency keys</text>
    <text x="28" y="158"><tspan fill="#2dd4bf">▸</tspan> MVVM + StateFlow · Robolectric UI tests · APK</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="67" height="24" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/><text x="61.5" y="242" fill="#c4b5fd" text-anchor="middle">Kotlin</text>
    <rect x="101" y="226" width="131" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="166.5" y="242" fill="#86efac" text-anchor="middle">Jetpack Compose</text>
    <rect x="238" y="226" width="81" height="24" rx="12" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-opacity=".55"/><text x="278.5" y="242" fill="#fcd34d" text-anchor="middle">Retrofit</text>
  </g>
  <text x="440" y="270" fill="#2dd4bf" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <rect x="20" y="0" width="44" height="62" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2"/><circle cx="42" cy="28" r="12" fill="none" stroke="#2dd4bf" stroke-opacity=".25" stroke-width="3"/><circle cx="42" cy="28" r="12" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="75.4" stroke-linecap="round" transform="rotate(-90 42 28)"><animate attributeName="stroke-dashoffset" values="0;75.4" dur="6s" repeatCount="indefinite"/></circle><rect x="30" y="48" width="24" height="6" rx="3" fill="#2dd4bf" opacity=".7"/>
</g>
</svg>
