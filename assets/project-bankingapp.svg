<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">Banking App</title>
<desc id="desc">Banking web app in Spring Boot and Thymeleaf: registration and login with Spring Security and BCrypt, multiple accounts, deposits, withdrawals, transfers and transaction history.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071624"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#38bdf8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2.5">WEB · SPRING BOOT</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🏦 Banking App</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#38bdf8">▸</tspan> Accounts, deposits, withdrawals, transfers</text>
    <text x="28" y="134"><tspan fill="#38bdf8">▸</tspan> Spring Security login with BCrypt</text>
    <text x="28" y="158"><tspan fill="#38bdf8">▸</tspan> Layered MVC: controller → service → JPA</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="52" height="24" rx="12" fill="#fb923c" fill-opacity=".15" stroke="#fb923c" stroke-opacity=".55"/><text x="54" y="242" fill="#fdba74" text-anchor="middle">Java</text>
    <rect x="86" y="226" width="102" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="137" y="242" fill="#86efac" text-anchor="middle">Spring Boot</text>
    <rect x="194" y="226" width="88" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="238" y="242" fill="#86efac" text-anchor="middle">Thymeleaf</text>
  </g>
  <text x="440" y="270" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <g fill="#38bdf8"><ellipse cx="40" cy="54" rx="22" ry="6" opacity="0.4"><animate attributeName="opacity" values="0;0.4" dur="1.6s" begin="0s" fill="freeze"/></ellipse><ellipse cx="40" cy="44" rx="22" ry="6" opacity="0.5800000000000001"><animate attributeName="opacity" values="0;0.5800000000000001" dur="1.6s" begin="0.25s" fill="freeze"/></ellipse><ellipse cx="40" cy="34" rx="22" ry="6" opacity="0.76"><animate attributeName="opacity" values="0;0.76" dur="1.6s" begin="0.5s" fill="freeze"/></ellipse><ellipse cx="40" cy="24" rx="22" ry="6" opacity="0.9400000000000001"><animate attributeName="opacity" values="0;0.9400000000000001" dur="1.6s" begin="0.75s" fill="freeze"/></ellipse></g>
</g>
</svg>
