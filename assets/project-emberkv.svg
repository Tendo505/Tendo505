<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-labelledby="title desc">
<title id="title">emberkv</title>
<desc id="desc">A Redis-compatible in-memory database written from scratch in Node.js: speaks the Redis protocol, works with the official redis-cli, supports TTLs, transactions, pub/sub and snapshots.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c0a0a"/><stop offset=".5" stop-color="#0d1728"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#f87171"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#f87171"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="468" height="288" rx="20" fill="url(#bg)"/>
<rect x="1.25" y="1.25" width="467.5" height="287.5" rx="19.75" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>
<g class="t">
  <text x="28" y="42" fill="#f87171" font-size="11" font-weight="700" letter-spacing="2.5">SYSTEMS · DATABASE</text>
  <text x="28" y="78" fill="#f8fafc" font-size="25" font-weight="800">🔥 emberkv</text>
  <g font-size="13.5" fill="#cbd5e1">
    <text x="28" y="110"><tspan fill="#f87171">▸</tspan> Speaks RESP: works with the official redis-cli</text>
    <text x="28" y="134"><tspan fill="#f87171">▸</tspan> 78 commands · TTLs, MULTI/EXEC, pub/sub</text>
    <text x="28" y="158"><tspan fill="#f87171">▸</tspan> Up to 480k req/s on redis-benchmark</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="28" y="226" width="74" height="24" rx="12" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".55"/><text x="65" y="242" fill="#86efac" text-anchor="middle">Node.js</text>
    <rect x="108" y="226" width="67" height="24" rx="12" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".55"/><text x="141.5" y="242" fill="#7dd3fc" text-anchor="middle">Docker</text>
  </g>
  <text x="440" y="270" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">View repo →</text>
</g>
<g transform="translate(350 168)">
  <g fill="none" stroke="#f87171" stroke-width="2"><rect x="0" y="10" width="24" height="24" rx="5" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0s" repeatCount="indefinite"/></rect><rect x="30" y="22" width="24" height="24" rx="5" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="60" y="10" width="24" height="24" rx="5" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect></g><text x="0" y="62" fill="#f87171" font-family="Consolas,monospace" font-size="11" opacity=".8">+PONG</text>
</g>
</svg>
