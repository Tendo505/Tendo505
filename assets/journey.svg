<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
<title id="title">My journey</title>
<desc id="desc">August 2024: started a Diploma in Computer Science at International Islamic College. Semester 1 2025/2026: Dean's List Award. 2025 to 2026: built PawCare, Phone Market Tracker and a Student Club Management System. 30 November 2026 to 19 February 2027: internship. March 2027: expected graduation.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1022"/><stop offset="1" stop-color="#0f1f3a"/></linearGradient>
  <linearGradient id="line" x2="1"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .draw{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 2.4s .2s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .n{opacity:0;animation:in .6s forwards}
  .n1{animation-delay:.3s}.n2{animation-delay:.8s}.n3{animation-delay:1.3s}.n4{animation-delay:1.8s}.n5{animation-delay:2.3s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s 2.6s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{to{transform:scale(2.4);opacity:0}}
  @media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.n{animation:none;opacity:1}.ping{animation:none}}
</style>
<rect x="1" y="1" width="958" height="208" rx="20" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
<line x1="90" y1="96" x2="870" y2="96" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
<line class="draw" x1="90" y1="96" x2="870" y2="96" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
<g class="t" text-anchor="middle">
  <g class="n n1">
    <circle cx="90" cy="96" r="9" fill="#0a1022" stroke="#60a5fa" stroke-width="3"/>
    <text x="90" y="60" fill="#60a5fa" font-size="13" font-weight="700" letter-spacing="1.5">AUG 2024</text>
    <text x="90" y="132" fill="#f8fafc" font-size="14" font-weight="600">Started Diploma</text>
    <text x="90" y="152" fill="#94a3b8" font-size="12">Computer Science</text>
    <text x="90" y="169" fill="#94a3b8" font-size="12">Int'l Islamic College</text>
  </g>
  <g class="n n2">
    <circle cx="285" cy="96" r="9" fill="#0a1022" stroke="#818cf8" stroke-width="3"/>
    <text x="285" y="60" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="1.5">SEM 1 · 2025/26</text>
    <text x="285" y="132" fill="#f8fafc" font-size="14" font-weight="600">🏆 Dean's List</text>
    <text x="285" y="152" fill="#94a3b8" font-size="12">Faculty of ICT</text>
  </g>
  <g class="n n3">
    <circle cx="480" cy="96" r="9" fill="#0a1022" stroke="#a78bfa" stroke-width="3"/>
    <text x="480" y="60" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.5">2025 – 2026</text>
    <text x="480" y="132" fill="#f8fafc" font-size="14" font-weight="600">Built 3 projects</text>
    <text x="480" y="152" fill="#94a3b8" font-size="12">PawCare · Phone Market</text>
    <text x="480" y="169" fill="#94a3b8" font-size="12">Tracker · Student Club</text>
  </g>
  <g class="n n4">
    <circle cx="675" cy="96" r="9" fill="#22c55e"/><circle class="ping" cx="675" cy="96" r="9" fill="#22c55e"/>
    <text x="675" y="60" fill="#4ade80" font-size="13" font-weight="700" letter-spacing="1.5">NOV 2026 – FEB 2027</text>
    <text x="675" y="132" fill="#f8fafc" font-size="14" font-weight="600">Internship</text>
    <text x="675" y="152" fill="#86efac" font-size="12">← your team here?</text>
  </g>
  <g class="n n5">
    <circle cx="870" cy="96" r="9" fill="#0a1022" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="870" y="60" fill="#2dd4bf" font-size="13" font-weight="700" letter-spacing="1.5">MAR 2027</text>
    <text x="870" y="132" fill="#f8fafc" font-size="14" font-weight="600">🎓 Graduation</text>
    <text x="870" y="152" fill="#94a3b8" font-size="12">Expected</text>
  </g>
</g>
</svg>
