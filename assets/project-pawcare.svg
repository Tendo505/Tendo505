<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">PawCare</title>
<desc id="desc">Pet management mobile application built with Kotlin, Laravel, PostgreSQL, REST APIs and Retrofit. Relational database for owners, pets, vaccinations, health records and appointments; Laravel MVC and CRUD services; reminders for vaccinations, medication, feeding, grooming and appointments.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d0b24"/><stop offset="1" stop-color="#10233d"/></linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset=".33" stop-color="#60a5fa"/><stop offset=".66" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
  .row{opacity:0;animation:in .5s forwards}
  .w2{animation-delay:.6s}.w3{animation-delay:1.1s}
  @keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
  .bell{transform-origin:900px 52px;animation:ring 3s ease-in-out infinite}
  @keyframes ring{0%,80%,100%{transform:none}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}}
  @media (prefers-reduced-motion:reduce){.row{animation:none;opacity:1}.bell{animation:none}}
</style>
<rect x="1" y="1" width="958" height="258" rx="22" fill="url(#bg)"/>
<circle cx="820" cy="130" r="200" fill="url(#glow)"/>
<rect x="1.25" y="1.25" width="957.5" height="257.5" rx="21.75" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
<g class="t">
  <rect x="36" y="30" width="148" height="24" rx="12" fill="#a78bfa" fill-opacity=".16"/>
  <text x="110" y="47" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">★ FEATURED BUILD</text>
  <text x="36" y="98" fill="#f8fafc" font-size="38" font-weight="800">🐾 PawCare</text>
  <text x="36" y="126" fill="#c4b5fd" font-size="15" font-weight="600">Full-stack pet management app — mobile, API and database</text>
  <g font-size="14" fill="#cbd5e1">
    <text x="36" y="156"><tspan fill="#a78bfa">▸</tspan> Designed the PostgreSQL schema: owners, pets, vaccinations, health records, appointments</text>
    <text x="36" y="178"><tspan fill="#a78bfa">▸</tspan> Built Laravel MVC + CRUD services, wired to the Kotlin app with Retrofit</text>
    <text x="36" y="200"><tspan fill="#a78bfa">▸</tspan> Reminders for vaccinations, medication, feeding, grooming and visits</text>
  </g>
  <g font-size="12" font-weight="700">
    <rect x="36" y="216" width="62" height="24" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/><text x="67" y="232" fill="#c4b5fd" text-anchor="middle">Kotlin</text>
    <rect x="104" y="216" width="68" height="24" rx="12" fill="#f87171" fill-opacity=".15" stroke="#f87171" stroke-opacity=".55"/><text x="138" y="232" fill="#fca5a5" text-anchor="middle">Laravel</text>
    <rect x="178" y="216" width="90" height="24" rx="12" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa" stroke-opacity=".55"/><text x="223" y="232" fill="#93c5fd" text-anchor="middle">PostgreSQL</text>
    <rect x="274" y="216" width="78" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".55"/><text x="313" y="232" fill="#5eead4" text-anchor="middle">REST API</text>
    <rect x="358" y="216" width="70" height="24" rx="12" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-opacity=".55"/><text x="393" y="232" fill="#fcd34d" text-anchor="middle">Retrofit</text>
  </g>
  <text x="560" y="232" fill="#a78bfa" font-size="13" font-weight="700">View repo →</text>
</g>
<g transform="translate(700 26)">
  <rect width="220" height="208" rx="18" fill="#070915" stroke="#334155"/>
  <rect x="14" y="14" width="192" height="46" rx="10" fill="url(#accent)"/>
  <circle cx="38" cy="37" r="14" fill="#070915" opacity=".35"/>
  <text x="38" y="42" font-size="14" text-anchor="middle">🐶</text>
  <rect x="60" y="28" width="76" height="7" rx="3.5" fill="#fff" opacity=".9"/>
  <rect x="60" y="40" width="50" height="6" rx="3" fill="#fff" opacity=".6"/>
  <g class="bell"><path d="M194 44 a6 6 0 0 1 12 0 v7 l3 4 h-18 l3-4z M197 58 h6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" transform="translate(-6 -10)"/></g>
  <g class="t" font-size="11">
    <g class="row"><rect x="14" y="72" width="192" height="36" rx="8" fill="#14243f"/><circle cx="30" cy="90" r="5" fill="#2dd4bf"/><text x="44" y="87" fill="#e2e8f0" font-weight="600">Rabies vaccine</text><text x="44" y="100" fill="#64748b">Due in 3 days</text></g>
    <g class="row w2"><rect x="14" y="114" width="192" height="36" rx="8" fill="#14243f"/><circle cx="30" cy="132" r="5" fill="#fbbf24"/><text x="44" y="129" fill="#e2e8f0" font-weight="600">Vet appointment</text><text x="44" y="142" fill="#64748b">Fri · 10:30 AM</text></g>
    <g class="row w3"><rect x="14" y="156" width="192" height="36" rx="8" fill="#14243f"/><circle cx="30" cy="174" r="5" fill="#a78bfa"/><text x="44" y="171" fill="#e2e8f0" font-weight="600">Feeding · Grooming</text><text x="44" y="184" fill="#64748b">Daily reminders</text></g>
  </g>
</g>
</svg>
